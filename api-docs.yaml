          format: int64
        employee:
          type: array
          items:
            $ref: "#/components/schemas/Employee"
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    EmployeeResponseDTO:
